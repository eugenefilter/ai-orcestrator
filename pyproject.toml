[project]
name = "soundkb"
version = "0.1.0"
description = "Local sound knowledge base for Ableton synth patching"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "fastembed>=0.5",
  "librosa>=0.10.2,<0.11",
  "matplotlib>=3.9",
  "mcp>=2.0",
  "numba==0.60.0",
  "numpy>=1.26",
  "onnxruntime==1.19.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pydantic>=2.9",
  "pyloudnorm>=0.1.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "qdrant-client>=1.12",
  "scipy>=1.14",
  "soundfile>=0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
audio-embed = ["transformers>=4.46", "torch>=2.4"]
dev = ["pytest>=8.3"]

[project.scripts]
soundkb = "soundkb.cli:main"
soundkb-ui = "soundkb.api.app:main"
soundkb-mcp = "soundkb.mcp_server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/soundkb"]
